name: zark
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zark
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - zark-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - zark-redis:/data

volumes:
  zark-postgres:
  zark-redis:
